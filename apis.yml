aid: jb-hunt-transport-services
name: J.B. Hunt Transport Services
description: >-
  J.B. Hunt Transport Services, Inc. is one of the largest transportation and logistics companies in North America,
  providing trucking, intermodal, and contract services. J.B. Hunt offers the J.B. Hunt 360 Connect API portal for
  shippers and partners to programmatically access quotes, order management, shipment tracking, document management, and
  scheduling for full-truckload (FTL) and less-than-truckload (LTL) operations.
